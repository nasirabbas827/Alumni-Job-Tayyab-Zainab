{% extends 'base.html' %}
{% block content %}

<h3>Update Application Status for "{{ application.job.title }}"</h3>

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label>Applicant: {{ application.applicant.full_name }}</label>
    </div>
    <div class="form-group">
        <label>Status</label>
        <select name="status" class="form-control">
            {% for key, value in status_choices %}
                <option value="{{ key }}" {% if application.status == key %}selected{% endif %}>{{ value }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{% url 'my_job_applications' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
