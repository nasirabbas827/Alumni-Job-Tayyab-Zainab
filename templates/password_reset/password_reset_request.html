{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3>Reset Password</h3>
                </div>
                <div class="card-body p-4">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                                {{ message }}
                                <button type="button" class="close" data-dismiss="alert">×</button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <p class="text-center mb-4">Enter your email address and we'll send you a link to reset your password.</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" required placeholder="you@example.com">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-4">Send Reset Link</button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="text-primary">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
